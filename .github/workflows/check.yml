name: Sprawdzenie strony

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Sprawdzenie strony
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Instalacja
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Sprawdzenie site.md
        run: npm run site:validate

      - name: Sprawdzenie typów
        run: npm run check

      - name: Budowa strony i test linków
        run: npm run build

      - name: Strona demonstracyjna (tylko w repo szablonu)
        if: hashFiles('examples/demo/site.md') != ''
        run: npm run demo:build
